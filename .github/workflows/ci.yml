name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy==1.26.4 && python -m pip install -e . --no-deps
      - name: Compile Python sources
        run: python -m compileall -q src autoencoder_decoder postprocess_on_class predict_sunspot_number predict_synoptic_map time_series_analysis
      - name: Run tests
        run: python -m unittest discover -s tests
